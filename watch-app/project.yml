# Xcode project for the Apple Watch app. Generate with: brew install xcodegen && xcodegen generate
#
# Two targets:
#   Nabda       the iPhone app. Its sources are the existing ios-app/Nabda, unchanged.
#               It embeds the watch app, so the .ipa built from it contains Watch/NabdaWatch.app.
#   NabdaWatch  the watchOS app (SwiftUI, no extension), in NabdaWatch/.
# ios-app/project.yml is untouched, so the iPhone-only IPA build stays exactly as it was.
name: NabdaWatch
options:
  bundleIdPrefix: com.playnabda
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Nabda:
    type: application
    platform: iOS
    sources:
      - path: ../ios-app/Nabda
    dependencies:
      - target: NabdaWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playnabda.app
        PRODUCT_NAME: Nabda
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: نبضة
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES

  NabdaWatch:
    type: application
    platform: watchOS
    sources:
      - path: NabdaWatch
    info:
      path: NabdaWatch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playnabda.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        # Apple Watch hardware is arm64_32. Building two architectures writes the
        # same executable path twice and fails with "Multiple commands produce".
        ARCHS: arm64_32
        VALID_ARCHS: arm64_32
