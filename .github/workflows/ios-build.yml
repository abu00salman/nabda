name: Build Nabda iOS app

# Compiles the iPhone app in ios-app/ on a macOS runner and produces an UNSIGNED .ipa.
# Xcode exists only on macOS, so this is the only place the Swift code is built.
#
# The .ipa is not signed, so iOS will not install it directly. To run it on an iPhone,
# re-sign it yourself with a sideloading tool (for example Sideloadly or AltStore) using
# your own Apple ID. Official signing and TestFlight need a paid Apple Developer account
# and are not done here.
on:
  push:
    branches: [main]
    paths: ["ios-app/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for iPhone
        run: |
          xcodebuild build \
            -project Nabda.xcodeproj \
            -scheme Nabda \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Nabda.app" -type d)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Nabda-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nabda-unsigned-ipa
          path: ios-app/Nabda-unsigned.ipa
          if-no-files-found: error
