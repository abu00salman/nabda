name: Build PlayNabda APK

# Builds the Android app in android-app/ on GitHub's own runners, which have a full
# Android SDK + internet access (unlike the sandbox this workflow was authored from,
# which has no SDK at all — see android-app/README.md). Runs on every push that
# touches android-app/, and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android-build.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships a full Android SDK (platforms, build-tools,
      # cmdline-tools) with ANDROID_HOME/sdkmanager on PATH — no setup-android action
      # needed. android-actions/setup-android@v3 was tried first and failed: it tries
      # to install the long-deprecated "tools" package, which Google removed from the
      # SDK repository years ago, so `sdkmanager` exits 1 before anything else runs.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayNabda-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Workflow artifacts (actions/upload-artifact above) are served from Azure Blob
      # Storage, which some network environments block outright — including the one
      # this workflow itself was authored from. Also publish the APK as a plain git
      # object on its own orphan branch, downloadable with nothing but `git fetch`
      # against github.com, which is reachable everywhere upload-artifact isn't.
      - name: Publish APK to the apk-builds branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/apk-out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/apk-out/PlayNabda-debug.apk
          git checkout --orphan apk-builds
          git rm -rf . > /dev/null
          cp /tmp/apk-out/PlayNabda-debug.apk .
          git add PlayNabda-debug.apk
          git commit -m "PlayNabda debug APK — built from ${{ github.sha }}"
          git push --force origin apk-builds
